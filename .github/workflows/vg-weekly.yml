name: VG weekly sales
on:
  schedule:
    - cron: "40 21 * * 1,2"   # Tue 8:40am and Wed 8:40am Sydney (UTC+11)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/vg_weekly.py
      - run: |
          git config user.name "vg-bot"; git config user.email "vg-bot@users.noreply.github.com"
          git add data/vg_weekly.psv
          git diff --cached --quiet || git commit -m "VG weekly sales update" && git push
