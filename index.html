<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#0f1720;--muted:#5b6573;--faint:#98a1ad;--line:#e4e7eb;--accent:#1f4e79;--accent-bg:#e8f0f8;--good:#1a7f4b;--good-bg:#e6f4ec;--warn:#9a5b00;--warn-bg:#fdf3e1;--bad:#b42318;--bad-bg:#fdecea;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--muted:#9aa4b1;--faint:#6b7480;--line:#262c35;--accent:#7cb3e8;--accent-bg:#14263a;--good:#5cc98d;--good-bg:#11291c;--warn:#e6b35c;--warn-bg:#2b2111;--bad:#f2867c;--bad-bg:#2d1513}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--faint)}button:active{transform:scale(.98)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.ghost{border-color:transparent;background:transparent}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:8px}.bar .brand{font-size:15px;gap:6px;white-space:nowrap}.bar .brand i{font-size:18px}
.hsearch{flex:1 1 60px;min-width:0;max-width:260px;height:34px;padding:4px 10px;font-size:15px;border-radius:999px}
.brand{font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{font-size:20px;color:var(--accent)}
.grow{flex:1}
nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}@media (max-width:380px){.bar{padding:8px 4px 8px 10px;gap:2px}.bar .brand{font-size:14px;gap:4px}nav{gap:0}nav button{padding:6px 6px;font-size:13.5px}}

  const k=e.key.length===1?e.key.toLowerCase():e.key; if(!/^([1-5]|s|c|Enter|Escape|Tab|Arrow\w+)$/.test(k)) return;
  uxPush("key",{g:"key:"+k,dt:now-UX.lastAct,d:"mouse"}); UX.lastAct=now; },true);
document.addEventListener("focusin",e=>{ const el=e.target; if(/INPUT|TEXTAREA|SELECT/.test(el.tagName)) UX.focus={el,at:Date.now(),v:el.type==="checkbox"?el.checked:el.value}; },true);
document.addEventListener("focusout",e=>{ const f=UX.focus; if(!f||f.el!==e.target) return; UX.focus=null; const el=f.el, now=Date.now();
  const changed=(el.type==="checkbox"?el.checked:el.value)!==f.v; if(!changed&&now-f.at<1500) return;
  uxPush("type",{g:uxLabel(el),p:uxPid(el),dt:now-f.at,m:{chars:el.tagName==="SELECT"?undefined:String(el.value||"").length,changed}}); UX.lastAct=now; },true);
addEventListener("scroll",()=>{ const y=scrollY; UX.scroll+=Math.abs(y-UX.lastY); UX.lastY=y; },{passive:true});
document.addEventListener("scroll",e=>{ if(e.target&&e.target.id==="sheet"){ const y=e.target.scrollTop, k="_sy"; UX.scroll+=Math.abs(y-(e.target[k]||0)); e.target[k]=y; } },{passive:true,capture:true});
// No input for over a minute while the app is open counts as idle; logged when you come back
function uxIdleCheck(now){ const gap=now-Math.max(UX.lastAct,UX.lastMove); if(gap>=60e3&&document.visibilityState==="visible") uxPush("idle",{dt:gap}); }
// Screen changes, with time spent and scrolling on the one you left
setInterval(()=>{ const s=uxScreen(); if(s===UX.screen) return; const now=Date.now();
  if(UX.screen) uxPush("view",{g:s,dt:now-UX.screenAt,m:{from:UX.screen,scroll:Math.round(UX.scroll)}});
  UX.screen=s; UX.screenAt=now; UX.scroll=0; },400);
document.addEventListener("visibilitychange",()=>{ const now=Date.now(); uxPush(document.visibilityState==="hidden"?"hide":"show",{dt:now-UX.lastAct}); if(document.visibilityState==="visible") UX.lastAct=now; else uxFlush(); });
async function uxFlush(){ if(!UX.q.length) return; const ev=UX.q.splice(0,400);
  if(DEMO||!S.token){ if(DEMO) (window.__ux=window.__ux||[]).push(...ev); return; }
  try{ const r=await fetch(API.replace(/\/api$/,"/ux"),{method:"POST",keepalive:true,headers:{"Content-Type":"application/json","x-session":S.token},body:JSON.stringify({sid:UX.sid,ev})}); if(!r.ok&&r.status!==401) throw 0; }
  catch{ UX.q.unshift(...ev.slice(0,2000)); } }
setInterval(uxFlush,15000);
// ---------- RP Data links for every property ----------
// A saved RP Data link (with its property number) opens the exact page. Otherwise the link is built from
// the address and opens RP Data's address search; the full address is also copied so it can be pasted straight in.
const POSTCODES={"Wollongong":"2500","North Wollongong":"2500","West Wollongong":"2500","Keiraville":"2500","Gwynneville":"2500","Mangerton":"2500","Coniston":"2500","Mount Keira":"2500","Mount Saint Thomas":"2500","Spring Hill":"2500",
  "Fairy Meadow":"2519","Balgownie":"2519","Mount Ousley":"2519","Mount Pleasant":"2519","Fernhill":"2519","Figtree":"2525",
  "Corrimal":"2518","East Corrimal":"2518","Bellambi":"2518","Towradgi":"2518","Tarrawanna":"2518","Woonona":"2517","Russell Vale":"2517","Bulli":"2516",
  "Thirroul":"2515","Austinmer":"2515","Coledale":"2515","Wombarra":"2515","Scarborough":"2515","Clifton":"2515"};
const RP_TYPES={rd:"road",st:"street",ave:"avenue",av:"avenue",cres:"crescent",cr:"crescent",pde:"parade",pl:"place",dr:"drive",cl:"close",ct:"court",crt:"court",hwy:"highway",tce:"terrace",la:"lane",ln:"lane",gr:"grove",gv:"grove",bvd:"boulevard",blvd:"boulevard",cct:"circuit",esp:"esplanade",wy:"way",pkwy:"parkway",sq:"square",cir:"circle",rdge:"ridge",gdns:"gardens",hts:"heights",mews:"mews"};
const RP_DIRS=/^(north|south|east|west|n|s|e|w)$/i;
function titleCase(t){ return String(t||"").toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()); }
// "22 Cokeworks Rd" + "Coledale" -> "22 Cokeworks Road, Coledale NSW 2515"
function rpAddress(addr,suburb,pc){ let w=String(addr||"").replace(/,.*$/,"").trim().split(/\s+/).filter(Boolean);
  // expand the street type: the last word, or the one before a direction like "North"
  let i=w.length-1; if(i>1&&RP_DIRS.test(w[i])) i--; if(i>0){ const k=w[i].toLowerCase().replace(/\.$/,""); if(RP_TYPES[k]) w[i]=RP_TYPES[k]; }
  const sub=titleCase(suburb), code=pc||POSTCODES[sub]||"";
  return `${titleCase(w.join(" "))}${sub?`, ${sub}`:""} NSW${code?" "+code:""}`.replace(/\s+/g," ").trim(); }
function rpSlug(full){ return full.toLowerCase().replace(/[\/,]/g," ").replace(/[^a-z0-9 ]/g,"").trim().replace(/\s+/g,"-"); }
function rpUrl(addr,suburb,saved,pc){ if(saved&&/rpp\.corelogic\.com\.au\/property\//.test(saved)) return saved;
  return `https://rpp.corelogic.com.au/search/address/${rpSlug(rpAddress(addr,suburb,pc))}`; }
// The RP button: works anywhere, never triggers the card or row it sits on
function rpBtn(addr,suburb,saved,cls="rpb",pc){ if(!addr&&!suburb) return ""; const exact=saved&&/rpp\.corelogic\.com\.au\/property\//.test(saved);
  return `<a class="${cls}${exact?" exact":""}" href="${esc(rpUrl(addr,suburb,saved,pc))}" target="_blank" rel="noopener" title="${exact?"Open in RP Data":"Search RP Data (address copied)"}" data-addr="${esc(rpAddress(addr,suburb,pc))}" onclick="event.stopPropagation();rpCopy(this)">RP</a>`; }
function rpCopy(a){ if(a.classList.contains("exact")) return; try{ navigator.clipboard&&navigator.clipboard.writeText(a.dataset.addr); }catch{} }
// Work timing: when each card came up, when you tapped call, when you came back to the app, when you logged it.
// Nothing here slows the call down; it just stamps times and sends them with the outcome.
function markShown(pid){ if(!S.tm||S.tm.pid!==pid) S.tm={pid,shown:Date.now()}; }
function markDial(pid){ if(!S.tm||S.tm.pid!==pid) S.tm={pid,shown:null}; S.tm.dial=Date.now(); S.tm.back=null; }
function skipCard(pid){ const ms=S.tm&&S.tm.pid===pid&&S.tm.shown?Date.now()-S.tm.shown:0; api("work_event",{kind:"skip",property_id:pid,ms}).catch(()=>{}); S.tm=null; S.skipped.add(pid); drawList(); scrollTo(0,0); }
document.addEventListener("click", e=>{ const a=e.target.closest('a[href^="tel:"]'); const c=a&&a.closest('#list .card[id^="c"]'); if(c) markDial(+c.id.slice(1)); }, true);
// Calls you log today, kept on the phone so the pace survives a refresh
function paceLog(){ try{ const k="pace_"+todayKey(); return JSON.parse(localStorage.getItem(k)||"[]"); }catch{ return []; } }
function pacePush(){ try{ const k="pace_"+todayKey(), a=paceLog(); a.push(Date.now()); localStorage.setItem(k,JSON.stringify(a.slice(-400))); }catch{} }
function pacePop(){ try{ const k="pace_"+todayKey(), a=paceLog(); a.pop(); localStorage.setItem(k,JSON.stringify(a)); }catch{} }
// Calls per hour over your last stretch of work (stops at any gap over 10 minutes)
function livePace(){ const a=paceLog(); if(a.length<3) return null; let i=a.length-1; while(i>0 && a[i]-a[i-1]<=600e3 && a.length-1-i<30) i--; const n=a.length-1-i, span=(a[a.length-1]-a[i])/36e5; if(n<2||span<5/60) return null; if(Date.now()-a[a.length-1]>600e3) return null; return Math.round(n/span); }
function nextDialable(currentId){
  return queue().filter(r=>!r.today_outcome && r.property_id!==currentId && !S.skipped.has(r.property_id) && r.phone && !(r.signals||[]).includes("probate"))
[0];
}
async function outcome(id, o){
  if (S.dialer && S.autodial && S.tab==="calls" && (o==="no_answer"||o==="not_interested")) {
    const nx = nextDialable(id);
    if (S.tm&&S.tm.pid===id) S.tmDone=S.tm;   // keep this call's timing before auto dial starts the next one
    if (nx) dialTo(nx.phone); // must happen inside the tap, before any waiting, or the phone blocks it
    await record(id, o, null);
    return;
  }
  if (o==="call_back"){ const el=$("#cb"+id); el.style.display = el.style.display==="none" ? "grid" : "none"; return; }
  if (o==="do_not_call" && !(await uiAsk("Mark as do not call? This number will never be listed again.", {ok:"Do not call"}))) return;
  await record(id, o, null);
}
// Telemarketing Industry Standard 2017: weekdays 9am to 8pm, Saturday 9am to 5pm, never Sundays or public holidays
function sydInfo(d){ const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23",weekday:"short"}).formatToParts(d).map(x=>[x.type,x.value]));
  return {key:`${p.year}-${p.month}-${p.day}`, dow:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(p.weekday)+1, mins:(+p.hour)*60+(+p.minute), wd:p.weekday}; }
function callDayOk(i){ return i.dow!==7 && !(S.holidays||new Set()).has(i.key); }
function callingAllowed(d=new Date()){ const i=sydInfo(d); if(!callDayOk(i)) return false; return i.mins>=540 && i.mins < (i.dow===6?1020:1200); }
function nextCallDay(offsetDays){ for(let k=offsetDays;k<offsetDays+10;k++){ const i=sydInfo(new Date(Date.now()+k*864e5)); if(!(S.holidays||new Set()).has(i.key)) return {k,...i}; } return {k:offsetDays,...sydInfo(new Date(Date.now()+offsetDays*864e5))}; }
function nextWindowText(){ for(let k=0;k<10;k++){ const i=sydInfo(new Date(Date.now()+k*864e5)); if(!callDayOk(i)) continue; if(k===0 && i.mins >= (i.dow===6?1020:1200)) continue; return k===0 ? "today at 9am" : k===1 ? "tomorrow at 9am" : `${i.wd} at 9am`; } return "on the next business day"; }
function callbackPicks(){
  const a=nextCallDay(1), b=a, c=nextCallDay(7);
  const lab=(d,h)=>`${d.k===1?"Tomorrow":d.wd} ${h>12?h-12+"pm":h+"am"}`;
  const eve = b.dow>=6 ? 16 : 17;
  return [[a.k,10,lab(a,10)],[b.k,eve,lab(b,eve)],[c.k,10,c.k===7?"Next week":lab(c,10)]];
}
function quickCallback(id, days, hour){
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(Date.now()+days*864e5)).map(x=>[x.type,x.value]));
  return record(id,"call_back",sydToISO(`${p.year}-${p.month}-${p.day}T${String(hour).padStart(2,"0")}:00`));
}

  $("#sheet").innerHTML=`<h3>When should you call back?</h3><input type="datetime-local" id="pcb" style="margin-top:12px" value="${sydInput(new Date(Date.now()+2*864e5)).slice(0,11)}10:00">
   <div style="display:flex;gap:8px;margin-top:14px"><button class="ghost" style="flex:1" onclick="closeOv()">Cancel</button><button class="primary" style="flex:2" id="pcbok">Save callback</button></div>`;
  $("#ov").classList.add("show");

async function saveCallback(id){ const v=$("#cbt"+id).value; if(!v) return toast("Pick a date and time"); await record(id,"call_back",sydToISO(v)); }
async function record(id, o, cb){
  if (S.saving.has(id)) return;              // ignore double taps
  S.saving.add(id);
  const row = S.rows.find(x=>x.property_id===id), cbr = (S.callbacks||[]).find(x=>x.property_id===id);
  const note = notes[id]||null;
  const tm = S.tmDone&&S.tmDone.pid===id ? S.tmDone : S.tm&&S.tm.pid===id ? S.tm : {}; if (S.tm&&S.tm.pid===id) S.tm=null; S.tmDone=null;   // grab the timing before the next card replaces it
  // Update the screen straight away, save in the background
  const apply = (v)=>{ if(row) row.today_outcome=v; if(cbr){ cbr.today_outcome=v; cbr.done=!!v; }
    if(S.ov){ const d=v?1:-1; S.ov.today_calls+=d; if(o!=="no_answer") S.ov.today_connected+=d; if(o==="appraisal") S.ov.today_appraisals+=d; } };
  apply(o); delete notes[id];
  if (navigator.vibrate) try{ navigator.vibrate(12); }catch{}
  const redraw = ()=>{ if (S.tab==="calls") { drawList(); drawProg(); if (S.dialer) scrollTo(0,0); } else render(); };
  redraw();
  try {
    const iso = v=>v?new Date(v).toISOString():null;
    pacePush(); drawProg();
    const r = await api("outcome",{property_id:id,outcome:o,callback_at:cb,notes:note,list_type:S.type,t_shown:iso(tm.shown),t_dial:iso(tm.dial),t_back:iso(tm.back),mode:S.dialer?"dialer":"list"});
    toast(`${LABEL[o]} saved`, async()=>{ await api("undo_outcome",{call_id:r.id}); pacePop(); apply(null); redraw(); });
    if (o==="appraisal") setTimeout(()=>openMessage(id, o), 150);
    if (o==="lead" && r.lead_id) { await loadLeads(); openLead(r.lead_id,{fresh:true}); }
    return r;
  } catch(e){
    apply(null); pacePop(); if (note) notes[id]=note; redraw();
    toast("Couldn't save that one. Check your signal and tap again.");
  } finally { S.saving.delete(id); }
}

    $("#extra").querySelectorAll(".dchip").forEach(x=>x.onclick=()=>{ pickDay=x.dataset.v; drawExtra(); prev(); });
    $("#extra").querySelectorAll(".tchip").forEach(x=>x.onclick=()=>{ pickTime=x.dataset.v; drawExtra(); prev(); }); };
  const args = ()=>({property_id:id,template_id:+$("#mt").value,appt_date:$("#xa")?.value||"{appt_date}",callback_date:$("#xc")?.value||"{callback_date}"});
  let pv={};

function toggleDialer(){ S.dialer=!S.dialer; try{localStorage.setItem("dp_dialer",S.dialer?"1":"0")}catch{} S.skipped.clear(); render(); }
function sydNow(){ const p=Object.fromEntries(new Intl.DateTimeFormat("en-AU",{timeZone:"Australia/Sydney",hour:"2-digit",hourCycle:"h23",weekday:"short"}).formatToParts(new Date()).map(x=>[x.type,x.value])); return {hr:+p.hour, dow:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(p.weekday)+1}; }
function bestTimeBanner(times){
  times=times||[]; const tot=times.reduce((a,t)=>a+t.calls,0); if (tot<200) return "";
  const avg=times.reduce((a,t)=>a+t.answered,0)/tot, {hr,dow}=sydNow();
  const slot=times.filter(t=>t.dow===dow&&t.hr===hr).reduce((a,t)=>({c:a.c+t.calls,a:a.a+t.answered}),{c:0,a:0});
  const today=times.filter(t=>t.dow===dow&&t.calls>=15).map(t=>({hr:t.hr,r:t.answered/t.calls})).sort((a,b)=>b.r-a.r).slice(0,2).map(t=>`${t.hr%12||12}${t.hr<12?"am":"pm"}`);
  if (slot.c<15) return today.length?`<div class="banner info"><i class="ti ti-clock"></i><div>Best answer times on this day: ${today.join(" and ")}.</div></div>`:"";
  const r=slot.a/slot.c, good=r>=avg;
  return `<div class="banner ${good?"info":"warn"}"><i class="ti ti-clock"></i><div>${good?"Good time to call":"Quiet time for answers"}: ${Math.round(r*100)}% pick up at this hour vs ${Math.round(avg*100)}% on average.${!good&&today.length?` Best today: ${today.join(" and ")}.`:""}</div></div>`;
}
async function openLetterbox(){
  try { const r = await api("letterbox",{limit:300}); const rows=r.rows||[];
    if (!rows.length) return toast("No properties without a phone on today's list");
    $("#sheet").innerHTML = `<div class="noprint" style="display:flex;gap:8px;margin-bottom:12px"><button class="primary" onclick="window.print()"><i class="ti ti-printer"></i>Print</button><button onclick="downloadLetterbox()"><i class="ti ti-download"></i>Download CSV</button><button class="ghost" onclick="closeOv()">Close</button></div>
      <h3>Letterbox drop list</h3><p class="muted">${rows.length} highest scoring properties with no phone number, sorted by suburb and street for walking. Deceased estates are left off.</p>
      <table><tr><th>Address</th><th>Suburb</th><th>Score</th></tr>${rows.map(x=>`<tr><td>${esc([x.unit&&x.unit+"/",x.house_number].filter(Boolean).join(""))} ${esc(x.street)}</td><td>${esc(x.suburb)}</td><td>${Math.round(x.score)}</td></tr>`).join("")}</table>`;
    S.letterbox=rows; $("#ov").classList.add("show");
  } catch(e){ toast(e.message); }
}
function downloadLetterbox(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv=["Unit,Number,Street,Suburb,Postcode,Score,Reasons",...(S.letterbox||[]).map(x=>[x.unit,x.house_number,x.street,x.suburb,x.postcode,Math.round(x.score),(x.reasons||[]).join("; ")].map(q).join(","))].join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=`letterbox-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}
const STAGE={appraisal:["Appraisal booked","warn"],listed:["Listed","good"],sold:["Sold","good"],lost:["Lost",""]};

// ---------- Card drops: houses with no phone number, as a list, a pin map and a heat map ----------
const DROP_DAYS=60;
// Pins stay small when zoomed out so the streets underneath are visible, and grow as you zoom in
function pinScale(){ const z=S.map?S.map.getZoom():13; return z<=12?0.55:z===13?0.7:z===14?0.85:z===15?1:z===16?1.3:1.6; }
function pinR(base){ return Math.max(1.6,base*pinScale()); }
function resizePins(){ if(!S.dlay||!S.dlay.eachLayer) return; S.dlay.eachLayer(m=>{ if(m.setRadius&&m.options.base!=null) m.setRadius(pinR(m.options.base)); }); }
function dropAddr(x){ return `${[x.unit&&x.unit+"/",x.house_number].filter(Boolean).join("")} ${x.street||""}`.trim(); }
function isDropped(x){ return x.dropped_at && Date.now()-new Date(x.dropped_at).getTime() < DROP_DAYS*864e5; }
function loadLeaflet(){
  if (window.L && L.heatLayer) return Promise.resolve();
  if (S._leaf) return S._leaf;
  const add=(tag,attrs)=>new Promise((ok,bad)=>{ const e=document.createElement(tag); Object.assign(e,attrs); e.onload=ok; e.onerror=()=>bad(new Error("Map could not load. Check your connection.")); document.head.appendChild(e); });
  S._leaf = add("link",{rel:"stylesheet",href:"https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"})
    .then(()=>add("script",{src:"https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"}))
    .then(()=>add("script",{src:"https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"}))
    .catch(e=>{ S._leaf=null; throw e; });
  return S._leaf;
}
function dropRows(){ const all=S.drops||[]; if (!S.dtop) return all;
  return all.filter(x=>!isDropped(x)).sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0)).slice(0,S.dtop); }
function setTop(n){ S.dtop=n; S._topChosen=true; try{localStorage.setItem("dp_dtop",String(n))}catch{} drawDrops(); }
function dropGroups(by){
  if ((S.streets||[]).length) {
    const byId=new Map((S.drops||[]).map(x=>[x.id,x])), live=id=>byId.has(id)&&!isDropped(byId.get(id));
    if (by!=="suburb") return S.streets.filter(st=>st.n>=3).map(st=>({k:`${st.street}, ${st.suburb}`,n:st.n,avg:sval(st),ids:(st.ids||[]).filter(live),pts:(st.paths||[]).flat().map(([x,y])=>[y,x])}))
      .filter(g=>g.ids.length).sort((a,b)=>b.avg-a.avg);
    const m=new Map();
    for (const st of S.streets) { const o=m.get(st.suburb)||{k:st.suburb,n:0,tot:0,ids:[],pts:[]}; o.n+=st.n; o.tot+=(Number(st.avg)||0)*st.n; o.ids.push(...(st.ids||[]).filter(live)); m.set(st.suburb,o); }
    for (const x of S.drops||[]) { const o=m.get(x.suburb); if (o&&x.lat!=null) o.pts.push([x.lat,x.lng]); }
    return [...m.values()].filter(o=>o.n>=10&&o.ids.length).map(o=>({...o,avg:o.tot/o.n})).sort((a,b)=>b.avg-a.avg);
  }
  const g=new Map();
  for (const x of dropRows()) { if (isDropped(x)) continue;
    const k = by==="suburb" ? (x.suburb||"Unknown") : `${x.street||"Unknown"}, ${x.suburb||""}`;
    const o=g.get(k)||{k,n:0,total:0,ids:[],pts:[]}; o.n++; o.total+=Number(x.score)||0; o.ids.push(x.id); if(x.lat!=null) o.pts.push([x.lat,x.lng]); g.set(k,o); }
  return [...g.values()].filter(o=>o.n>=3).map(o=>({...o,avg:o.total/o.n})).sort((a,b)=>b.avg-a.avg);
}
// Tiny IndexedDB helpers for big data we want to keep between visits
function idb(){ return S._idb||(S._idb=new Promise((ok,no)=>{ try{ const q=indexedDB.open("prospect",1); q.onupgradeneeded=()=>q.result.createObjectStore("kv"); q.onsuccess=()=>ok(q.result); q.onerror=()=>no(q.error); }catch(e){ no(e); } })); }
async function idbGet(k){ try{ const d=await idb(); return await new Promise(ok=>{ const r=d.transaction("kv").objectStore("kv").get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>ok(null); }); }catch{ return null; } }
async function idbSet(k,v){ try{ const d=await idb(); d.transaction("kv","readwrite").objectStore("kv").put(v,k); }catch{} }
function applyDrops(raw, dropped){
  const marks=dropped?new Map(dropped.map(([id,at])=>[id,at])):null;
  S.drops=(raw.rows||[]).map(x=>{ const o=Array.isArray(x)?{id:x[0],unit:x[1],house_number:x[2],street:x[3],suburb:x[4],lat:x[5],lng:x[6],score:x[7],reasons:[x[8]],dropped_at:x[9]}:x;
    if (marks) o.dropped_at=marks.get(o.id)||null; return o; });
  S.streets=raw.streets||[];
}
async function viewDrops(){
  if (S.dtop===undefined) { try{ const v=localStorage.getItem("dp_dtop"); S.dtop=+v||0; S._topChosen=v!==null; }catch{ S.dtop=0 } }
  S.dview=S.dview||"map"; S.dlayer=S.dlayer||"pins"; S.dgroup=S.dgroup||"street";
  // The 57,000 addresses are kept on the device; the server only sends them again when the scores change
  if (!S.dropsRaw) { const c=await idbGet("drops"); if (c&&c.version) { S.dropsRaw=c; S.dropMarks=c.marks||null; } }
  const firstTop=()=>{ if (S.dtop===0 && !S._topChosen && S.drops.length>3000) S.dtop=1000; }; // lots of addresses: start on the top 1000 so the phone stays quick
  let shown=false;
  if (S.dropsRaw) { applyDrops(S.dropsRaw, S.dropMarks); firstTop(); if(S.tab==="drops"){ drawDrops(); shown=true; } }
  const r=await api("drops",{have:S.dropsRaw?.version||null});
  const changed=!r.same; if (changed) S.dropsRaw={version:r.version,rows:r.rows||[],streets:r.streets||[]};
  S.dropMarks=r.dropped||null; S.dropsRaw.marks=S.dropMarks; idbSet("drops",S.dropsRaw);
  applyDrops(S.dropsRaw, S.dropMarks);
  if (S.tab!=="drops") return;
  firstTop();
  if (!shown || changed || S.dview==="list") { const y=scrollY; drawDrops(); if(shown) scrollTo(0,y); }
  else { drawBest(); drawDropLayer(); }   // same addresses: just refresh the dropped marks on the map
}
function drawDrops(){
  const all=S.drops||[], left=all.filter(x=>!isDropped(x)), onMap=all.filter(x=>x.lat!=null).length;
  const seg=(key,opts,fn)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${S[key]===v?"on":""}" onclick="S.${key}='${v}';${fn}">${l}</button>`).join("")}</div>`;
  if (!all.length) { $("#main").innerHTML=`<div class="empty"><i class="ti ti-mailbox"></i>No houses without a phone number yet.<br>They appear here once properties are imported.</div>`; return; }
  const head=`<div class="top">${seg("dview",[["map","Map"],["list","List"]],"drawDrops()")}${S.dview==="map"?seg("dlayer",[["pins","Pins"],["heat","Heat"],["streets","Streets"]],"drawDropLayer()"):`<button class="iconbtn" onclick="window.print()" title="Print" aria-label="Print"><i class="ti ti-printer"></i></button><button class="iconbtn" onclick="downloadDrops()" title="Download" aria-label="Download"><i class="ti ti-download"></i></button>`}</div>
    <div class="chips"><span class="muted">Top</span>${[[0,"All"],[1000,"1000"],[500,"500"],[250,"250"],[100,"100"],[50,"50"]].map(([n,l])=>`<button class="${S.dtop===n?"on":""}" onclick="setTop(${n})">${l}</button>`).join("")}</div>
    <p class="muted" style="margin:0 0 8px;font-size:13px">${S.dtop?`Showing the top ${Math.min(S.dtop,left.length)} of ${left.length} houses to drop`:`${left.length} houses to drop · ${all.length-left.length} dropped in the last ${DROP_DAYS} days`}${onMap<all.length?` · ${all.length-onMap} not on the map yet`:""}</p>`;
  if (S.dview==="list") { $("#main").innerHTML=head+dropListHTML(); return; }
  $("#main").innerHTML = head + `<div id="dmap" class="dmap"><div class="empty" style="padding:40px 0"><i class="ti ti-loader-2"></i>Loading map</div></div>
    <div class="top" style="margin-top:4px"><b style="font-size:15px;margin-right:auto">Best places to drop</b>${seg("dgroup",[["street","Streets"],["suburb","Suburbs"]],"drawBest()")}</div><div id="best"></div>`;
  drawBest();
  loadLeaflet().then(()=>{ if (S.tab!=="drops"||!$("#dmap")) return;
    if (S.map) { try{S.map.remove()}catch{} }
    $("#dmap").innerHTML="";
    S.map=L.map("dmap",{zoomControl:false,attributionControl:true}).setView([-34.36,150.91],12);
    S.map.on("zoomend",resizePins);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(S.map);
    const pts=dropRows().filter(x=>x.lat!=null).map(x=>[x.lat,x.lng]); if (pts.length) S.map.fitBounds(pts,{padding:[20,20]});
    drawDropLayer();
  }).catch(e=>{ const m=$("#dmap"); if(m) m.innerHTML=`<div class="empty" style="padding:40px 0"><i class="ti ti-wifi-off"></i>${esc(e.message)}</div>`; });
}
function drawDropLayer(){
  document.querySelectorAll(".top .seg").forEach(g=>{ const b=[...g.querySelectorAll("button")]; if(b[0]&&b[0].textContent==="Pins") ["pins","heat","streets"].forEach((v,i)=>b[i]&&b[i].classList.toggle("on",S.dlayer===v)); });
  if (!S.map) return;
  if (S.dlay) { S.map.removeLayer(S.dlay); S.dlay=null; }
  if (S.dleg) { S.dleg.remove(); S.dleg=null; }
  if (S.dlayer==="streets") return drawStreetLayer();
  const rows=dropRows().filter(x=>x.lat!=null), max=Math.max(1,...rows.map(x=>Number(x.score)||0));
  // Units in a block share one point: group them so a block is one pin and counts once on the heat map
  const bmap=new Map();
  for (const x of rows) { const k=x.lat.toFixed(6)+","+x.lng.toFixed(6); const b=bmap.get(k)||{lat:x.lat,lng:x.lng,xs:[]}; b.xs.push(x); bmap.set(k,b); }
  const blds=[...bmap.values()].map(b=>{ const left=b.xs.filter(x=>!isDropped(x)); return {...b,left,score:b.xs.reduce((a,x)=>a+(Number(x.score)||0),0)/b.xs.length}; });
  if (S.dlayer==="heat") {
    S.dlay=L.heatLayer(blds.filter(b=>b.left.length).map(b=>[b.lat,b.lng,Math.max(0.15,b.score/max)]),{radius:28,blur:22,maxZoom:16,minOpacity:0.3}).addTo(S.map);
    return;
  }
  const accent=getComputedStyle(document.body).getPropertyValue("--accent").trim()||"#1f4e79";
  S.canvas=S.canvas||L.canvas({padding:0.5});
  S.dlay=L.layerGroup(blds.map(b=>{ const d=!b.left.length, t=b.score/max, x=b.xs[0], many=b.xs.length>1;
    const label=many?`${esc([x.house_number].filter(Boolean).join(""))} ${esc(x.street||"")} · ${b.xs.length} units`:esc(dropAddr(x));
    const base=d?2.5:3+t*2.5+(many?1:0);
    return L.circleMarker([b.lat,b.lng],{renderer:S.canvas,base,radius:pinR(base),weight:many?1.5:0.6,color:d?"#9aa3ad":accent,fillColor:d?"#c9ced4":accent,fillOpacity:d?0.5:0.35+t*0.55})
      .bindPopup(()=>`<b>${label}</b>${many?"":rpBtn(dropAddr(x),x.suburb,null,"rpb",x.postcode)}<br>${esc(x.suburb||"")}<br><span style="color:#667">${many?`${b.left.length} of ${b.xs.length} letterboxes to drop`:esc((x.reasons||[])[0]||"")}</span><br>${d?`<button style="margin-top:8px;width:100%" onclick="toggleDrop([${b.xs.map(y=>y.id)}],true)">Undo dropped</button>`:`<button style="margin-top:8px;width:100%" onclick="toggleDrop([${b.left.map(y=>y.id)}],false)">${many?"Mark building dropped":"Mark dropped"}</button>`}`); })).addTo(S.map);
}

// Streets coloured like traffic: the average score of every house on the street decides the colour
// Streets ranked by how likely their houses are to sell (the algorithm's average score). Equal scores always share a colour.
const STREET_TIERS=[["Most likely to sell",0.15,"#c5221f",7],["Likely",0.35,"#f29900",6],["Some chance",0.6,"#f6c026",5]];
const sval=st=>Number(st.adj ?? st.avg)||0;
function streetTier(st,ranked){ if (st.n<3||!ranked.length) return null;
  for (const t of STREET_TIERS) { const cut=sval(ranked[Math.min(ranked.length-1,Math.max(0,Math.ceil(t[1]*ranked.length)-1))]); if (sval(st)>=cut) return t; }
  return null; }
const STREET_KEYS=["most","likely","some","done","rest"], STREET_LABELS={most:"Most",likely:"Likely",some:"Some",done:"Done",rest:"Rest"};
function streetShown(){ if(!S.stiers){ try{ const v=JSON.parse(localStorage.getItem("dp_stiers")||"null"); S.stiers=new Set(Array.isArray(v)?v:STREET_KEYS); }catch{ S.stiers=new Set(STREET_KEYS); } } return S.stiers; }
function toggleTier(k){ const sh=streetShown(); sh.has(k)?sh.delete(k):sh.add(k); try{localStorage.setItem("dp_stiers",JSON.stringify([...sh]))}catch{} drawDropLayer(); }
function showAllTiers(){ S.stiers=new Set(STREET_KEYS); try{localStorage.removeItem("dp_stiers")}catch{} drawDropLayer(); }
function drawStreetLayer(){
  const shown=streetShown();
  const ranked=(S.streets||[]).filter(x=>x.n>=3).sort((a,b)=>sval(b)-sval(a));
  const byId=new Map((S.drops||[]).map(x=>[x.id,x]));
  const lines=[];
  const order=[...(S.streets||[])].sort((a,b)=>sval(a)-sval(b)); // draw best last so it sits on top
  for (const st of order) {
    const t=streetTier(st,ranked), left=(st.ids||[]).filter(id=>byId.has(id)&&!isDropped(byId.get(id)));
    const done=(st.ids||[]).length>0 && !left.length;
    const key=done?"done":t?["most","likely","some"][STREET_TIERS.indexOf(t)]:"rest";
    if (!shown.has(key)) continue;
    const style=done?{color:"#9aa3ad",weight:4,opacity:.8,dashArray:"6 6"}:t?{color:t[2],weight:t[3],opacity:.9}:{color:"#8a94a3",weight:2.5,opacity:.45};
    for (const path of st.paths||[]) lines.push(L.polyline(path.map(([x,y])=>[y,x]),{...style,lineCap:"round"}).bindPopup(()=>`<b>${esc(st.street)}</b>, ${esc(st.suburb)}<br>${t?`<span style="color:${t[2]};font-weight:600">${t[0]}</span><br>`:st.n<3?`<span style="color:#667">Too few houses known to rate</span><br>`:""}Likely to sell score ${Math.round(sval(st))} · ${st.n} address${st.n===1?"":"es"}${st.dwellings>st.n?` (${st.dwellings} letterboxes)`:""}${st.known!=null&&st.known<st.n?`, ${st.n-st.known} without a known sale date`:""}<br>${left.length} without a number to drop${left.length?`<br><button style="margin-top:8px;width:100%" onclick="toggleDrop([${left}],false)">Mark street dropped</button>`:done?"<br>Dropped":""}`));
  }
  S.dlay=L.layerGroup(lines).addTo(S.map);
  const leg=L.control({position:"bottomleft"});
  const col={most:STREET_TIERS[0][2],likely:STREET_TIERS[1][2],some:STREET_TIERS[2][2],done:"#9aa3ad",rest:"#c9ced4"};
  leg.onAdd=()=>{ const d=L.DomUtil.create("div","dleg"); L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
    d.innerHTML=`<b style="width:100%">Streets most likely to sell</b>`
      +STREET_KEYS.map(k=>`<button class="${shown.has(k)?"":"off"}" onclick="toggleTier('${k}')" aria-pressed="${shown.has(k)}"><i style="background:${col[k]}"></i>${STREET_LABELS[k]}</button>`).join("")
      +(shown.size<STREET_KEYS.length?`<button class="all" onclick="showAllTiers()">Show all</button>`:"");
    return d; };
  leg.addTo(S.map); S.dleg=leg;
}
function drawBest(){
  document.querySelectorAll(".top .seg").forEach(g=>{ const b=g.querySelectorAll("button"); if(b.length===2&&b[0].textContent==="Streets"){ b[0].classList.toggle("on",S.dgroup==="street"); b[1].classList.toggle("on",S.dgroup==="suburb"); } });
  const gs=dropGroups(S.dgroup).slice(0,12), top=gs[0]?.avg||1;
  S._best=gs;
  $("#best").innerHTML = gs.length ? gs.map((g,i)=>`<div class="card brow" style="padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px">
      <div style="flex:1;min-width:0" onclick="zoomBest(${i})"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${i+1}. ${esc(g.k)}</div>
      <div class="bar2" style="height:4px;border-radius:9px;background:var(--line);margin:6px 0 4px;overflow:hidden"><div style="height:100%;width:${Math.max(4,Math.round(100*g.avg/top))}%;background:var(--accent)"></div></div>
      <div class="muted" style="font-size:12px">Score ${Math.round(g.avg)} · ${g.n} address${g.n===1?"":"es"} · ${g.ids.length} letterbox${g.ids.length===1?"":"es"} to drop</div></div>
      <button style="min-height:38px;font-size:13px" onclick="toggleDrop(S._best[${i}].ids,false)"><i class="ti ti-check"></i>Dropped</button></div>`).join("")
    : `<p class="muted">Everything has been dropped in the last ${DROP_DAYS} days.</p>`;
}
function zoomBest(i){ const g=S._best[i]; if(!S.map||!g||!g.pts.length) return; S.map.fitBounds(g.pts,{padding:[30,30],maxZoom:17}); scrollTo({top:0,behavior:"smooth"}); }
function dropListHTML(){
  const bySub=new Map();
  for (const x of dropRows()) { const s=x.suburb||"Unknown", st=x.street||"Unknown"; if(!bySub.has(s)) bySub.set(s,new Map()); const m=bySub.get(s); if(!m.has(st)) m.set(st,[]); m.get(st).push(x); }
  const num=x=>parseInt(String(x.house_number||"").replace(/^.*\//,""))||0;
  const big=dropRows().length>1500;
  return [...bySub.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([sub,m])=>(big?`<details class="dsub"><summary><h3 style="display:inline;margin:0">${esc(sub)}</h3> <span class="muted">${[...m.values()].reduce((a,xs)=>a+xs.length,0)}</span></summary>`:`<h3 style="margin:16px 0 6px">${esc(sub)}</h3>`)+
    [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([st,xs])=>{ xs.sort((a,b)=>num(a)-num(b)); const ids=xs.filter(x=>!isDropped(x)).map(x=>x.id);

function ltype(t){ t=String(t||"").toLowerCase(); if(/unit|apartment|flat/.test(t)) return "Apartment"; if(/town/.test(t)) return "Townhouse"; if(/villa/.test(t)) return "Villa"; if(/land|vacant|lot/.test(t)) return "Land"; return t?"House":""; }
const MUST_RX={"No stairs":/single[- ]level|single[- ]storey|no stairs|one level|level (entry|access)/i,"Single level":/single[- ]level|single[- ]storey|one level/i,
  "Granny flat":/granny|secondary dwelling|self[- ]contained/i,"Pool":/\bpool\b/i,"Ocean view":/ocean|sea view|water view|coastal view/i,
  "Double garage":/double (lock[- ]?up )?garage|two car garage/i,"Yard":/yard|garden|lawn/i,"Near school":/school/i};
// Tier 1: everything they want (budget included) and in their area. Tier 2: everything they want but another area. Otherwise no match.
function matchLead(l, t){
  const b=l.buy||{}, unknown=[], desc=String(t.description||"");
  if (b.max && t.price_min!=null && +t.price_min > +b.max) return null;
  if (b.min && t.price_max!=null && +t.price_max < +b.min) return null;
  if ((b.max||b.min) && t.price_min==null && t.price_max==null) unknown.push("price");
  for (const k of ["beds","baths","cars"]) if (b[k]) { if (t[k]==null) unknown.push(k); else if (+t[k] < +b[k]) return null; }
  if ((b.types||[]).length) { const ty=ltype(t.ptype); if (!ty) unknown.push("type"); else if (!b.types.includes(ty)) return null; }
  if (b.land) { if (t.land==null) unknown.push("land"); else if (+t.land < +b.land) return null; }
  if (b.flat) { if (!desc) unknown.push("flat block"); else if (!/\b(level|flat)\b[^.]{0,20}\b(block|land|site|lot|yard|parcel)\b|level block|flat block|level land/i.test(desc)) return null; }
  for (const m of b.musts||[]) {
    if (m==="Double garage" && t.cars!=null && +t.cars>=2) continue;
    const rx=MUST_RX[m]||new RegExp(m.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");
    if (!desc) { unknown.push(m.toLowerCase()); continue; }
    if (!rx.test(desc)) return null;
  }
  const subs=(b.suburbs||[]).map(s=>s.toLowerCase()), inArea=!subs.length || subs.includes(String(t.suburb||"").toLowerCase());
  return {tier:inArea?1:2, unknown};

// Saves everything changed on the lead in one go: the contact log, what they want to buy, and their details
async function saveLeadAll(id){
  const btn=$("#lead_save"); if(btn.disabled) return;
  if(!id){ btn.disabled=true; btn.textContent="Adding…"; try{ await saveLeadDetails(null, readBuy()); }finally{ btn.disabled=false; } return; }
  const cur=(S.leads||[]).find(x=>x.id===id)||{}, jobs=[];
  const body=$("#ln_body").value.trim(), st=$("#ln_status").value, nx=$("#ln_next").value||null;
  const contactChanged=body||S.ol.follow_up||st!==(cur.status||"Active")||(S.ol.temperature||null)!==(cur.temperature||null)||nx!==(cur.next_action||null);
  if(contactChanged){ const p={id,body,status:st,next_action:nx}; if(S.ol.follow_up) p.follow_up=S.ol.follow_up; if(S.ol.temperature) p.temperature=S.ol.temperature; jobs.push(api("lead_note",p)); }
  const buy=readBuy(), det=readDetails(), lead={};
  if(JSON.stringify(buy)!==S.olOrig.buy){ lead.buy=buy; if(hasCriteria(buy)&&(!cur.lead_type||cur.lead_type==="Potential Vendor")&&!det.lead_type) lead.lead_type="Buyer/Vendor"; }
  if(JSON.stringify(det)!==S.olOrig.details) Object.assign(lead,det);
  if(Object.keys(lead).length) jobs.push(api("save_lead",{id,lead}));
  if(!jobs.length){ btn.textContent="Nothing changed"; setTimeout(()=>{ if($("#lead_save")) $("#lead_save").textContent="Save"; },1500); return; }
  btn.disabled=true; btn.textContent="Saving…";
  try{ await Promise.all(jobs); await loadLeads(); openLead(id,{saved:true,keepScroll:true}); if(S.tab==="leads") drawLeads(); }
  catch(e){ btn.disabled=false; btn.textContent="Didn't save. Tap to try again"; btn.classList.add("err"); }
}
function pickOne(btn, sel){ const box=btn?btn.parentElement:document.querySelector(sel); box.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===btn)); }
function addSub(inp){ const v=inp.value.trim(); if(!v) return; const s=SUBURBS.find(x=>x.toLowerCase()===v.toLowerCase())||v.replace(/\b\w/g,c=>c.toUpperCase());
  if(![...document.querySelectorAll("#b_subs button")].some(b=>b.textContent.replace(" ×","")===s)) $("#b_subs").insertAdjacentHTML("beforeend",`<button class="on" onclick="this.remove()">${esc(s)} ×</button>`); inp.value=""; }
// "$1.5M", "1.5m", "1500000", "900k", "1.2" (millions) -> dollars
function parseMoney(v){ v=String(v||"").trim().toLowerCase().replace(/[$,\s]/g,""); if(!v) return null; const m=v.match(/^([\d.]+)(m|k)?$/); if(!m) return null; const n=parseFloat(m[1]); return Math.round(n*(m[2]==="m"?1e6:m[2]==="k"?1e3:(n<100?1e6:1))); }
function readBuy(){
  const on=sel=>[...document.querySelectorAll(sel+" button.on")].map(b=>b.textContent.replace(" ×","").trim());
  const extra=$("#b_must_add").value.trim(); if($("#b_sub_add").value.trim()) addSub($("#b_sub_add"));
  const b={max:parseMoney($("#b_max").value),min:parseMoney($("#b_min").value),beds:+$("#b_beds").value||null,baths:+$("#b_baths").value||null,cars:+$("#b_cars").value||null,
    types:on("#b_types").filter(t=>t!=="Flat block"),land:+$("#b_land").value||null,flat:$("#b_flat").classList.contains("on"),musts:[...on("#b_musts"),...(extra?[extra]:[])],suburbs:on("#b_subs")};
  Object.keys(b).forEach(k=>{ if(b[k]===null||b[k]===false||(Array.isArray(b[k])&&!b[k].length)) delete b[k]; });
  return b;
}
function readDetails(){ const o={}; for(const k of ["name","phone","address","suburb","lead_type","source","timeframe","rp_link","motivation"]) o[k]=$("#d_"+k).value.trim()||null; return o; }
async function saveBuy(id){
  const buy=readBuy();
  if(!id) return saveLeadDetails(null, buy);
  const cur=(S.leads||[]).find(x=>x.id===id)||{};
  try{ await api("save_lead",{id,lead:{buy,...(hasCriteria(buy)&&(!cur.lead_type||cur.lead_type==="Potential Vendor")?{lead_type:"Buyer/Vendor"}:{})}}); await loadLeads(); toast("Saved"); openLead(id); }catch(e){ toast(e.message); }
}
async function saveLeadDetails(id, buy){
  const d=readDetails();
  if(!id){ const b=buy||readBuy(); if(hasCriteria(b)) d.buy=b; d.follow_up=addDaysKey(3); d.temperature="Warm"; }
  try{ const r=await api("save_lead",{id,lead:d}); await loadLeads(); openLead(r.id||id,{saved:true}); if(S.tab==="leads") drawLeads(); }
  catch(e){ const b=$("#lead_save"); if(b){ b.textContent=e.message; b.classList.add("err"); } }
}
async function saveLeadNote(id){
  const cur=(S.leads||[]).find(x=>x.id===id)||{};
  const body=$("#ln_body").value.trim(), st=$("#ln_status").value, nx=$("#ln_next").value||null;
  const p={id,body,status:st,next_action:nx}; if(S.ol.follow_up) p.follow_up=S.ol.follow_up; if(S.ol.temperature) p.temperature=S.ol.temperature;
  if(!body && !S.ol.follow_up && st===(cur.status||"Active") && (p.temperature||null)===(cur.temperature||null) && nx===(cur.next_action||null)){ toast("Add a note or pick a follow up"); return; }
  $("#ln_go").disabled=true;

function scorecard(ov){
  const f=ov.funnel||[], st=ov.settings||{}, goal=+(st.target_rate??3), wkTarget=(+(st.daily_target??100))*5;
  if(!f.length) return "";
  const sum=(arr,k)=>arr.reduce((a,x)=>a+(+x[k]||0),0);
  const t=f[0]||{}, l=f[1]||{}, last4=f.slice(1,5), n4=Math.max(1,last4.length);
  const avg=k=>sum(last4,k)/n4;
  const per100=(a,c)=>c?100*a/c:null, pct=(a,c)=>c?100*a/c:null;
  const fmtN=v=>v==null?"–":(Math.round(v*10)/10).toString().replace(/\.0$/,"");
  const fmtP=v=>v==null?"–":Math.round(v)+"%";
  const a4={calls:avg("calls"),answered:avg("answered"),call_appraisals:avg("call_appraisals"),appraisals:avg("appraisals"),listings:avg("listings")};
  const row=(label,fn,fmtF,goodFn)=>{ const vals=[fn(t),fn(l),fn(a4)]; return `<tr><td>${label}</td>${vals.map((v,i)=>`<td style="${i===0&&goodFn&&v!=null?`color:${goodFn(v)?"var(--good)":"var(--bad)"};font-weight:600`:""}">${fmtF(v)}</td>`).join("")}</tr>`; };
  const tot8={appraisals:sum(f,"appraisals"),listings:sum(f,"listings"),calls:sum(f,"calls"),answered:sum(f,"answered"),call_appraisals:sum(f,"call_appraisals")};
  // Biggest leak, judged on the last 4 full weeks
  let leak;
  if (!tot8.calls && !tot8.appraisals) leak="Fills in once you start logging calls.";
  else if (a4.calls < wkTarget*0.85) leak=`<b>Dials.</b> Averaging ${Math.round(a4.calls)} calls a week against ${wkTarget}. More dials is the quickest lift.`;
  else if (tot8.answered>=100 && per100(tot8.call_appraisals,tot8.answered) < goal) leak=`<b>Conversations to appraisals.</b> ${fmtN(per100(tot8.call_appraisals,tot8.answered))} per 100 answered against your goal of ${goal}. Work on the opener and the ask.`;
  else if (tot8.appraisals>=5 && tot8.listings/tot8.appraisals < 0.3) leak=`<b>Appraisals to listings.</b> Only ${fmtP(pct(tot8.listings,tot8.appraisals))} of appraisals have listed in 8 weeks. Follow up harder after each appraisal.`;
  else leak="<b>On track.</b> No clear leak in the last 4 weeks.";
  return `<h2>Weekly scorecard</h2><div class="card scard">
    <div class="banner info" style="margin:0 0 10px"><i class="ti ti-target-arrow"></i><div>${leak}</div></div>
    <table><tr><th></th><th>This wk</th><th>Last wk</th><th>4 wk avg</th></tr>
     ${row(`Calls <span class="muted">/ ${wkTarget}</span>`,x=>+x.calls||0,fmtN,v=>v>=wkTarget)}
     ${row("Answered",x=>+x.answered||0,fmtN)}
     ${row("Answer rate",x=>pct(x.answered,x.calls),fmtP)}
     ${row("Appraisals",x=>+x.appraisals||0,fmtN)}
     ${row(`Per 100 answered <span class="muted">/ ${goal}</span>`,x=>per100(x.call_appraisals,x.answered),fmtN,v=>v>=goal)}
     ${row("Listings",x=>+x.listings||0,fmtN)}
    </table>
    <p class="muted" style="margin:8px 0 0;font-size:12px">Weeks run Monday to Sunday. Appraisals and listings count every source. Per 100 counts call appraisals only. Over 8 weeks: ${tot8.appraisals} appraisal${tot8.appraisals===1?"":"s"}, ${tot8.listings} listing${tot8.listings===1?"":"s"}${tot8.appraisals?` (${fmtP(pct(tot8.listings,tot8.appraisals))} converted)`:""}.</p></div>`;
}

const secs=v=>v==null?"–":v<90?`${Math.round(v)}s`:`${Math.round(v/60)} min`;

const hr12=h=>`${(h%12)||12}${h<12?"am":"pm"}`;
function effHTML(w,days){
  const t=w.totals||{}, chips=[[1,"Today"],[7,"7 days"],[30,"30 days"]].map(([d,l])=>`<button class="${d===days?"on":""}" onclick="drawEff(${d})">${l}</button>`).join("");
  const head=`<div class="chipgrid sm" style="margin:0 0 8px">${chips}</div>`;
  if(!t.calls) return head+`<div class="card muted">No calls logged ${days===1?"today":"in this period"} yet. Make some calls and this fills in by itself.</div>`;
  const activeH=(t.active_s||0)/3600, cph=activeH>0?t.calls/activeH:null, perDay=t.calls/Math.max(1,t.days);
  const noans=t.calls-t.answered, onPhone=(t.ring_s!=null||t.talk_s!=null)?((t.ring_s||0)*noans+(t.talk_s||t.ring_s||0)*t.answered)/t.calls:null;
  const parts=[["Before dialling",t.prep_s,"#7c93b5"],["On the phone",onPhone,"var(--accent)"],["Logging it",t.wrap_s,"#e0a040"]].filter(x=>x[1]!=null);
  const tot=parts.reduce((a,x)=>a+x[1],0);
  const bar=parts.length?`<div style="display:flex;height:14px;border-radius:999px;overflow:hidden;margin:10px 0 6px">${parts.map(([l,v,c])=>`<div style="width:${100*v/tot}%;background:${c}" title="${l}"></div>`).join("")}</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px">${parts.map(([l,v,c])=>`<span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${c};margin-right:5px"></span>${l} <b>${secs(v)}</b></span>`).join("")}</div>`
    :`<p class="muted" style="font-size:13px;margin:8px 0 0">The split of each call (before dialling, on the phone, logging) starts from your next calls. It needs the new version of the app, so close and reopen it once.</p>`;
  // What would each fix be worth: seconds saved per call, turned into extra calls a day at your current pace
  const cyc=t.cycle_s||(cph?3600/cph:null), extra=s=>cyc&&s>0?Math.round(perDay*(cyc/Math.max(5,cyc-s)-1)):0;
  const tips=[], wb=Object.fromEntries((w.wrap_by_outcome||[]).map(x=>[x.outcome,x]));
  if(t.prep_s>12) tips.push([extra(t.prep_s-6),`You take <b>${secs(t.prep_s)}</b> to dial once a card comes up. Read the name, tap the number, read the reasons while it rings.`]);
  if(t.ring_s>28) tips.push([extra((t.ring_s-25)*noans/t.calls),`Unanswered calls ring for <b>${secs(t.ring_s)}</b> before you hang up. Hang up at about 25 seconds (5 rings).`]);
  if(wb.call_back&&wb.call_back.wrap_s>20) tips.push([extra((wb.call_back.wrap_s-8)*wb.call_back.n/t.calls),`Call backs take <b>${secs(wb.call_back.wrap_s)}</b> to log. Use the quick time buttons instead of Pick a time.`]);
  if(wb.no_answer&&wb.no_answer.wrap_s>6) tips.push([extra((wb.no_answer.wrap_s-3)*wb.no_answer.n/t.calls),`No answers take <b>${secs(wb.no_answer.wrap_s)}</b> to log after you hang up. Tap No answer the moment you're back in the app.`]);
  if(t.breaks) tips.push([0,`<b>${t.breaks}</b> break${t.breaks>1?"s":""} over 10 minutes, <b>${mins(t.break_s/60)}</b> in total. Work in 45 minute blocks with a set 5 minute break so breaks don't drift.`]);

  const hrs=(w.by_hour||[]).filter(h=>h.calls>=10).map(h=>({...h,rate:h.answered/h.calls})); const best=hrs.sort((a,b)=>b.rate-a.rate)[0];
  if(best&&hrs.length>1) tips.push([0,`People pick up most at <b>${hr12(best.h)}</b> (${Math.round(100*best.rate)}% answer). Keep that hour for calls only.`]);
  tips.sort((a,b)=>b[0]-a[0]);
  const hoursRow=(w.by_hour||[]).length>1?(()=>{ const mx=Math.max(...w.by_hour.map(h=>h.calls/h.days)); return `<div style="display:flex;gap:3px;align-items:flex-end;height:60px;margin-top:10px">${w.by_hour.map(h=>{ const v=h.calls/h.days, r=h.calls?h.answered/h.calls:0; return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" title="${hr12(h.h)}: ${Math.round(v)} calls, ${Math.round(100*r)}% answered"><div style="width:100%;height:${Math.max(3,44*v/mx)}px;border-radius:4px 4px 0 0;background:var(--accent);opacity:${0.35+0.65*Math.min(1,r*3)}"></div><span style="font-size:10px;color:var(--muted)">${hr12(h.h).replace(/m$/,"")}</span></div>`; }).join("")}</div><p class="muted" style="font-size:12px;margin:4px 0 0">Calls by hour of day. Darker means more people answered.</p>`; })():"";
  return head+`<div class="card">
    <div style="display:flex;align-items:baseline;gap:8px"><b style="font-size:32px;letter-spacing:-.02em">${cph?Math.round(cph):"–"}</b><span class="muted">calls per working hour</span></div>
    <div class="muted" style="font-size:13px">${t.calls} calls in ${mins((t.active_s||0)/60)} of calling${t.days>1?` over ${t.days} days`:""}${t.cycle_s?` · one every ${secs(t.cycle_s)}`:""}</div>
    ${bar}${hoursRow}</div>
   ${tips.length?`<div class="card"><b>Biggest time savers</b>${(()=>{ const sum=tips.slice(0,4).reduce((a,x)=>a+x[0],0); return sum>1?`<div class="muted" style="font-size:13px">Fix these and it's about <b style="color:var(--good)">${sum} more calls a day</b> in the same hours.</div>`:""; })()}${tips.slice(0,4).map(([x,txt])=>`<p style="margin:8px 0 0;font-size:14px;line-height:1.4">${txt}${x>0?` <span style="color:var(--good);font-weight:600;white-space:nowrap">≈ +${x} call${x===1?"":"s"} a day</span>`:""}</p>`).join("")}</div>`:""}
   ${(w.long_gaps||[]).length?`<details class="sec"><summary>Longest gaps between calls</summary><div>${w.long_gaps.map(g=>`<p style="margin:4px 0">${esc(g.from_at)} · <b>${g.mins} min</b></p>`).join("")}<p class="muted" style="font-size:12px">Gaps between 10 minutes and 2 hours on the same day. Longer than that counts as finishing for the day.</p></div></details>`:""}`;
}

    <div class="rtl">${[["noanswer_gap_days","After a missed call",3],["noanswer_rest_days","After 6 missed calls in a row",90],["not_interested_days","Not interested",365],["lead_closed_days","After a lead is closed or lost",180],["appraisal_days","After an appraisal",365],["sold_days","After it sells",1095],["recent_call_days","Any answered call, at least",7]].map(([k,l,d])=>`<label class="rtlrow"><span>${l}</span><span class="rtlin"><input type="number" min="1" id="r_${k}" value="${s[k]??d}"><span class="muted">days</span></span></label>`).join("")}</div>
    <button class="primary" style="width:100%;margin-top:12px" onclick="saveReturn()">Save</button></div></details>
   <details class="sec"><summary>Password</summary><div><label style="margin-top:0">Current password</label><input type="text" autocapitalize="off" autocorrect="off" spellcheck="false" id="p0"><label>New password (10+ characters)</label><input type="text" autocapitalize="off" autocorrect="off" spellcheck="false" id="p1"><button style="margin-top:12px;width:100%" onclick="changePw()">Change password</button></div></details>
   <button class="ghost" style="width:100%;color:var(--muted)" onclick="logout()"><i class="ti ti-logout"></i>Sign out</button>`;
}
function tplCard(t){ return `<div class="card"><label style="margin-top:0">${t.id?"Name":"New template name"}</label><input id="tn${t.id}" value="${esc(t.name)}"><label>Message</label><textarea id="tb${t.id}">${esc(t.body)}</textarea>
  <label>Default send time</label><select id="td${t.id}">${WHEN.filter(w=>w[0]!=="custom").map(([k,l])=>`<option value="${k}" ${k===t.default_delay?"selected":""}>${l}</option>`).join("")}</select>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="primary" onclick="saveTpl(${t.id})">${t.id?"Save":"Add template"}</button>${t.id?`<button class="ghost" style="color:var(--bad)" onclick="delTpl(${t.id})">Delete</button>`:""}</div></div>`; }
async function saveTpl(id){ const body=$("#tb"+id).value; if(!/stop/i.test(body) && !(await uiAsk("This message has no STOP opt out. Save anyway?", {ok:"Save anyway"}))) return; try{ await api("save_template",{id:id||null,name:$("#tn"+id).value,body,default_delay:$("#td"+id).value}); S.templates=[]; toast("Template saved"); render(); }catch(e){toast(e.message);} }
async function delTpl(id){ if(!(await uiAsk("Delete this template?", {ok:"Delete"}))) return; await api("delete_template",{id}); S.templates=[]; render(); }
async function saveSettings(){ const v={seller_list_size:+$("#s1").value,landlord_list_size:+$("#s2").value,control_pct:Math.min(50,Math.max(0,+$("#s3").value))/100,require_dncr_wash:$("#s4").value==="true",quiet_start:$("#s5").value,quiet_end:$("#s6").value,daily_target:Math.max(1,+$("#s7").value||100),target_rate:Math.max(0.5,+$("#s8").value||3)}; await api("settings",{values:v}); toast("Settings saved"); }
async function saveReturn(){ const v={}; for (const k of ["noanswer_gap_days","noanswer_rest_days","not_interested_days","lead_closed_days","appraisal_days","sold_days","recent_call_days"]) v[k]=Math.max(1,Math.round(+$("#r_"+k).value||1));
  try{ await api("settings",{values:v}); toast("Saved. Tomorrow's list uses these."); }catch(e){ toast(e.message); } }
async function regen(){ toast("Building list"); try{ const r=await api("regenerate"); toast(r.rows>=0?`List rebuilt (${r.rows} new)`:"Build failed, see Insights"); }catch(e){toast(e.message);} }
async function changePw(){ try{ await api("change_password",{old:$("#p0").value,new:$("#p1").value}); toast("Password changed. Sign in again."); store.del("dp_token"); S.token=null; setTimeout(render,800);}catch(e){toast(e.message);} }
function parseCSV(text){ const rows=[]; let row=[],f="",q=false; for(let i=0;i<text.length;i++){const c=text[i]; if(q){ if(c==='"'&&text[i+1]==='"'){f+='"';i++;} else if(c==='"') q=false; else f+=c; } else if(c==='"') q=true; else if(c===','){row.push(f);f="";} else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; } else f+=c; } if(f||row.length){row.push(f);rows.push(row);} return rows.filter(r=>r.some(x=>x.trim())); }
const ALIAS={
 unit:["unit","unit_number","unit_no","flat"],
 house_number:["house_number","street_number","street_no","number","house_no","st_no"],
 street:["street","street_name","road"],
 suburb:["suburb","locality","town","property_suburb"],
 postcode:["postcode","post_code","pcode","zip"],
 address:["address","street_address","property_address","full_address","site_address"],
 owner_name:["owner_name","owner","owners","owner_1","owner_1_name","owner1","owner_names","vendor","vendor_name","contact_name","name","full_name"],
 first_name:["first_name","firstname","given_name"],
 last_name:["last_name","surname","lastname","family_name"],
 phone:["phone","mobile","mobile_phone","owner_phone","phone_number","contact_number","mobile_number","home_phone","ph","contact_phone"],
 owner_address:["owner_address","mailing_address","postal_address","owner_postal_address"],
 bedrooms:["bedrooms","beds","bed","no_of_bedrooms","bedroom"],
 land_area:["land_area","land_size","land_size_m2","area","land","lot_size"],
 last_sale_date:["last_sale_date","sale_date","last_sold_date","sold_date","contract_date","date_sold","last_sold"],
 last_sale_price:["last_sale_price","sale_price","last_sold_price","sold_price","price"],
 previous_sale_date:["previous_sale_date","prior_sale_date","second_last_sale_date"],
 is_landlord:["is_landlord","landlord","investor","owner_type","occupancy","owner_occupied"],
 crm_flag:["crm_flag","in_crm"],
 notice_date:["notice_date","date_of_notice","published","published_date"],
 solicitor:["solicitor","law_firm","applicant_solicitor"],
 event_date:["event_date","withdrawn_date","expired_date","date_withdrawn","off_market_date","listing_end_date"],
 registered:["registered","on_register","dncr","dncr_registered","status"]};
const keyOf=h=>h.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
function toISO(v){ v=(v||"").trim(); if(!v) return ""; let m;
  if((m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))){ let y=+m[3]; if(y<100) y+= y>40?1900:2000; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  const M={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  if((m=v.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[A-Za-z]*[\s\-](\d{2,4})$/))&&M[m[2].toLowerCase()]){ let y=+m[3]; if(y<100) y+= y>40?1900:2000; return `${y}-${String(M[m[2].toLowerCase()]).padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return ""; }
const num=v=>{ const n=String(v||"").replace(/[^0-9.]/g,""); return n?n:""; };
function splitAddress(a){ a=a.replace(/\s+/g," ").trim(); const o={}; let m;
  if((m=a.match(/\b(\d{4})\s*$/))){ o.postcode=m[1]; a=a.slice(0,m.index).trim(); }
  a=a.replace(/[, ]+(NSW|N\.S\.W\.?)$/i,"").trim();
  let parts=a.split(",").map(x=>x.trim()).filter(Boolean);
  if(parts.length>1){ o.suburb=parts.pop(); a=parts.join(" "); }
  if((m=a.match(/^(?:(?:unit|u|apt|lot)\s*)?([0-9A-Za-z]+)\s*\/\s*([0-9]+[A-Za-z]?(?:-[0-9]+)?)\s+(.*)$/i))){ o.unit=m[1]; o.house_number=m[2]; o.street=m[3]; }
  else if((m=a.match(/^([0-9]+[A-Za-z]?(?:-[0-9]+[A-Za-z]?)?)\s+(.*)$/))){ o.house_number=m[1]; o.street=m[2]; }
  else o.street=a;
  if(!o.suburb && o.street){ const w=o.street.match(/^(.*\b(?:st|street|rd|road|ave|avenue|dr|drive|pde|parade|cres|crescent|pl|place|cl|close|ct|court|ln|lane|way|tce|terrace|hwy|highway|cct|circuit|gr|grove|blvd|boulevard))\s+(.+)$/i); if(w){ o.street=w[1]; o.suburb=w[2]; } }
  return o; }
function mapRows(rows){
  const heads=rows[0].map(keyOf), col={}, used=new Set();
  for(const [k,al] of Object.entries(ALIAS)){ const i=heads.findIndex((h,ix)=>!used.has(ix)&&al.includes(h)); if(i>=0){ col[k]=i; used.add(i);} }
  const out=[]; for(const r of rows.slice(1)){
    const g=k=>col[k]!==undefined?(r[col[k]]??"").trim():"";
    const o={unit:g("unit"),house_number:g("house_number"),street:g("street"),suburb:g("suburb"),postcode:g("postcode")};
    if(!o.street && g("address")) Object.assign(o, Object.fromEntries(Object.entries(splitAddress(g("address"))).filter(([k,v])=>v && !o[k])));
    o.owner_name=g("owner_name")||[g("first_name"),g("last_name")].filter(Boolean).join(" ");
    o.phone=g("phone"); o.owner_address=g("owner_address");
    o.bedrooms=num(g("bedrooms")).split(".")[0]; o.land_area=num(g("land_area"));
    o.last_sale_date=toISO(g("last_sale_date")); o.last_sale_price=num(g("last_sale_price")); o.previous_sale_date=toISO(g("previous_sale_date"));
    const ll=g("is_landlord").toLowerCase(), llh=col.is_landlord!==undefined?heads[col.is_landlord]:"";
    o.is_landlord = llh==="owner_occupied" ? /^(n|no|false|0)$/.test(ll) : (/^(y|yes|true|1)$/.test(ll) || /invest|rent|tenant|non.?owner/.test(ll));
    if(!o.is_landlord && o.owner_address && o.street && !/^(po box|p\.o\.|locked bag|gpo)/i.test(o.owner_address.trim())){ const oa=o.owner_address.toLowerCase(), st=o.street.toLowerCase().split(" ")[0]; if(!(oa.includes(st) && (!o.house_number || oa.includes(o.house_number.toLowerCase())))) o.is_landlord=true; }
    o.crm_flag=/^(y|yes|true|1)$/i.test(g("crm_flag")) || $("#ik").value==="crm";
    o.notice_date=toISO(g("notice_date")); o.solicitor=g("solicitor"); o.event_date=toISO(g("event_date"));
    const rg=g("registered").toLowerCase(); o.registered=/^(y|yes|true|1|registered|on register|do not call)$/.test(rg);
    out.push(o); }
  return {out, col, heads};
}
async function previewCSV(){
  const file=$("#if").files[0]; if(!file) return;
  const rows=parseCSV(await file.text()); if(rows.length<2){ $("#ir").textContent="File looks empty"; return; }
  const {out,col,heads}=mapRows(rows); S.pending=out;
  const got=Object.entries(col).map(([k,i])=>`${rows[0][i].trim()} → ${k.replace(/_/g," ")}`);
  const ignored=heads.map((h,i)=>Object.values(col).includes(i)?null:rows[0][i].trim()).filter(Boolean);
  const ok=out.filter(o=>o.street||$("#ik").value==="dncr").length;
  const ex=out.find(o=>o.street)||out[0];
  $("#ir").innerHTML=`<b>${out.length.toLocaleString()} rows found, ${ok.toLocaleString()} with a usable address.</b><br>Matched columns: ${esc(got.join(" · ")||"none")}${ignored.length?`<br>Ignored: ${esc(ignored.join(", "))}`:""}<br>First row reads as: ${esc([ex.unit&&ex.unit+"/",ex.house_number,ex.street,ex.suburb,ex.postcode].filter(Boolean).join(" "))}${ex.owner_name?" · "+esc(ex.owner_name):""}${ex.last_sale_date?" · sold "+ex.last_sale_date:""}${ex.phone?" · "+esc(ex.phone):""}`;
}
async function importCSV(){
  if(!S.pending) await previewCSV(); const objs=S.pending; if(!objs||!objs.length) return toast("Choose a CSV file");
  const kind=$("#ik").value==="crm"?"properties":$("#ik").value;
  const base=$("#ir").innerHTML;
  try{ let n=0; for(let i=0;i<objs.length;i+=1000){ n+=(await api("import",{kind,rows:objs.slice(i,i+1000)})).imported; $("#ir").innerHTML=base+`<br>Imported ${n.toLocaleString()} of ${objs.length.toLocaleString()}`; }
    toast(`Imported ${n.toLocaleString()} rows`); S.pending=null; $("#if").value=""; }
  catch(e){ $("#ir").innerHTML=base+"<br>"+esc(e.message); }
}

if (S.token) loadCallbacks().then(render); else render();
if (!DEMO && "serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
